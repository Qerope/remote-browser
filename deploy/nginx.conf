limit_req_zone $binary_remote_addr zone=rb:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    limit_req zone=rb burst=100 nodelay;
    client_max_body_size 1k;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://unix:/run/remote-browser/sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;        # overwrite, never append: the app trusts this
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1d;
    }
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
